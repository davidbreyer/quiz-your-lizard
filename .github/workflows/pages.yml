name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out prototype
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static app
        run: |
          mkdir _site
          cp index.html styles.css app.js core.js seed.js _site/
          cp -R assets vendor _site/
          touch _site/.nojekyll

      - name: Version browser assets
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          site = Path('_site')
          page = (site / 'index.html').read_text()
          for name in ('styles.css', 'app.js', 'core.js', 'seed.js'):
              asset = site / name
              digest = hashlib.sha256(asset.read_bytes()).hexdigest()[:16]
              versioned = f'{asset.stem}.{digest}{asset.suffix}'
              asset.rename(site / versioned)
              page = page.replace(f'"{name}"', f'"{versioned}"')
          (site / 'index.html').write_text(page)
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
