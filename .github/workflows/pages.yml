name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out prototype
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static app
        run: |
          mkdir _site
          cp index.html styles.css app.js core.js seed.js _site/
          cp -R assets vendor _site/
          touch _site/.nojekyll

      - name: Keep previous asset URLs during the versioning transition
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import subprocess
          previous = '38577d6999484a6df68581b0bc0639d00a364d85'
          for name in ('styles.css', 'app.js', 'core.js', 'seed.js'):
              content = subprocess.check_output(['git', 'show', f'{previous}:{name}'])
              digest = hashlib.sha256(content).hexdigest()[:16]
              asset = Path(name)
              Path('_site', f'{asset.stem}.{digest}{asset.suffix}').write_bytes(content)
          PY

      - name: Version browser assets
        run: |
          version="$(TZ=America/New_York date +v%Y%m%d-%H%M)"
          python tools/version-site.py --directory _site --version "$version"

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
