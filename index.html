<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#235b43">
  <meta name="app-version" content="v20261009-2105">
  <title>Quiz Your Lizard</title>
  <link rel="icon" type="image/png" href="assets/lizard.png?v=v20261009-2105">
  <link rel="stylesheet" href="styles.css?v=v20261009-2105">
  <script defer src="vendor/lucide.min.js?v=v20261009-2105"></script>
  <script defer src="seed.js?v=v20261009-2105"></script>
  <script defer src="core.js?v=v20261009-2105"></script>
  <script defer src="app.js?v=v20261009-2105"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="Quiz Your Lizard home"><img src="assets/lizard.png?v=v20261009-2105" alt=""><span>Quiz Your<br><strong>Lizard</strong></span></a>
      <div class="nav-label">YOUR WORKSPACE</div>
      <nav aria-label="Main navigation">
        <button class="nav-button active" data-view="library"><i data-lucide="library"></i><span>Quiz library</span><span id="library-count" class="nav-count"></span></button>
        <button class="nav-button" data-view="history"><i data-lucide="chart-no-axes-combined"></i><span>Practice history</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="storage-line"><span class="status-dot"></span><span id="storage-label">Saved on this device</span></div>
        <div class="storage-track"><span id="storage-meter"></span></div>
        <button class="quiet" data-action="backup"><i data-lucide="download"></i>Export backup</button>
      </div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><span class="breadcrumb" id="breadcrumb">Your workspace / Quiz library</span><span class="topbar-caption">A little practice. A lot of progress.</span><button class="icon-button mobile-backup" data-action="backup" aria-label="Export backup" title="Export backup"><i data-lucide="download" aria-hidden="true"></i></button></header>
      <main id="main" tabindex="-1"></main>
      <footer><span>Quiz Your Lizard &middot; <span id="app-version">v20261009-2105</span></span><span>Make room for something new.</span></footer>
    </div>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <input type="file" id="import-file" accept=".json,.qyl,.xml" hidden>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
